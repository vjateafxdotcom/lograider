version: '3.8'

services:
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-lograider}
      - DB_USER=${DB_USER:-lograider}
      - DB_PASSWORD=${DB_PASSWORD:-lograider_password}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key}
      - JWT_EXPIRY=7d
      - FRONTEND_URL=http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lograider

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lograider}
      POSTGRES_USER: ${DB_USER:-lograider}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lograider_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lograider}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lograider

volumes:
  postgres_data:

networks:
  lograider:
    driver: bridge
